# Pre-alpha headless API only: no Web UI, Telegram bot or TLS yet.
services:
  kordra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      KORDRA_LISTEN: "0.0.0.0:8079"
      KORDRA_DATA_DIR: /config
      KORDRA_DOWNLOAD_DIR: /downloads
      KORDRA_API_TOKEN: ${KORDRA_API_TOKEN:?Set a strong local API token}
    ports:
      - "127.0.0.1:8079:8079"
    volumes:
      - kordra-config:/config
      - ./downloads:/downloads
volumes:
  kordra-config:
