name: Headless binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.triple }} -p kordra-daemon -p kordra-cli
      - uses: actions/upload-artifact@v4
        with:
          name: kordra-headless-${{ matrix.triple }}
          path: |
            target/${{ matrix.triple }}/release/kordra-daemon*
            target/${{ matrix.triple }}/release/kordra-cli*
