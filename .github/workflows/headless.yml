name: Headless binaries / GitHub releases
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
jobs:
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - name: Build headless daemon and CLI
        run: cargo build --release --target ${{ matrix.triple }} -p kordra-daemon -p kordra-cli
      - name: Package archives
        shell: bash
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          triple = os.environ["TARGET"]
          build = Path("target") / triple / "release"
          suffix = ".exe" if "windows" in triple else ""
          dest = Path("packages")
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(dest / f"kordra-headless-{triple}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for binary in ("kordra-daemon", "kordra-cli"):
                  filename = binary + suffix
                  archive.write(build / filename, filename)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kordra-headless-${{ matrix.triple }}
          path: packages/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kordra-headless-*
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          prerelease: true
          generate_release_notes: true
