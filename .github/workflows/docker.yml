name: Docker - GitHub hosted
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docker/**", "apps/**", "crates/**", "Cargo.toml", "Cargo.lock"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: kordra:ci
